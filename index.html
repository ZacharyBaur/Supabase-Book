<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Book Table</title>
</head>
<body>
    <h1>Favorite Books Table</h1>
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
            </tr>
        </thead>
        <tbody id="data-table">
            <!-- Data will be populated here by JavaScript -->
        </tbody>
    </table>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        const supabaseUrl = 'https://rrbzxwuzrfidmjctawaz.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJyYnp4d3V6cmZpZG1qY3Rhd2F6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzODk2OTMsImV4cCI6MjA4Nzk2NTY5M30.kkqVeG2dN4RGYdf11-OBwUEXpS7j_7_uebZCchOj8Jo';
        const supabase = createClient(supabaseUrl, supabaseKey);

        async function fetchData() {
            const { data, error } = await supabase
                .from('books')
                .select('*');

            if (error) {
                console.error('Error retrieving data:', error);
                return;
            }

            const tableBody = document.getElementById('data-table');
            data.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row.id}</td>
                    <td>${row.title}</td>
                    <td>${row.author}</td>
                `;
                tableBody.appendChild(tr);
            });
        }

        fetchData();
    </script>
</body>
</html>
